# ~/.config/fuzzel/fuzzel.ini

# Behavior
exit-on-keyboard-focus-loss=no
auto-select=yes
terminal=foot -e

# Appearance
font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
width=25
lines=13
horizontal-pad=16
vertical-pad=12
inner-pad=10
border-radius=8

[colors]
background=000000e6
text=ddddddff
match=f9e2afff
selection=1a1a1aee
selection-text=ffffffff
border=333333ff
input=ffffffff


