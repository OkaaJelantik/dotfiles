### Display layout (Laptop + External presentation display)
# Sway does not mirror outputs natively; external outputs sit beside eDP-1
# and are mirrored via wl-mirror ($mod+p / scripts/present-mirror).
output eDP-1 mode 1920x1080 pos 0 0
output HDMI-A-1 pos 1920 0
output DP-1 pos 1920 0

