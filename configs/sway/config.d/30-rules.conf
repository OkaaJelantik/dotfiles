### Decorations
default_border pixel 1

client.focused          #888888   #888888   #000000  #888888    #888888
client.focused_inactive #333333   #333333   #666666  #333333    #333333
client.unfocused        #333333   #333333   #666666  #333333    #333333

### Window Rules
for_window [app_id="(?i)spotify"] {
    floating enable
    resize set 1100 700
    move position center
}
for_window [class="(?i)spotify"] {
    floating enable
    resize set 1100 700
    move position center
}

